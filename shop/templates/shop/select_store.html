{% extends 'shop/base.html' %}
{% block content %}
<div class="container py-5">
  <h2 class="mb-4">Select Your Store</h2>

  <form method="POST">
    {% csrf_token %}
    {% if stores %}
      <div class="form-group">
        {% for store in stores %}
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="store_key" id="store_{{ store.key }}" value="{{ store.key }}" required>
            <label class="form-check-label" for="store_{{ store.key }}">
              {{ store.name }}
            </label>
          </div>
        {% endfor %}
      </div>
      <button type="submit" class="btn btn-primary mt-3">Continue</button>
    {% else %}
      <p>No stores available.</p>
    {% endif %}
  </form>
</div>
{% endblock %}
